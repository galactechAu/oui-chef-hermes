name: Public safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject private deployment details and credential-like values
        run: python3 scripts/public_safety_scan.py
      - name: Run application tests
        run: python3 -m unittest discover -s tests -q
      - name: Compile application modules
        run: python3 -m py_compile app.py core.py store.py generation.py recipe_importer.py recipe_page.py realtime.py allergies.py
      - name: Validate JavaScript syntax
        run: python3 scripts/check_javascript.py
      - name: Reject whitespace errors
        run: git diff --check
  browser-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install browser test dependencies
        run: |
          python3 -m pip install playwright==1.62.0
          python3 -m playwright install --with-deps chromium
      - name: Exercise Recipe Books in a real browser
        run: |
          export OUI_BROWSER_EXECUTABLE="$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python3 -m unittest discover -s tests -p test_books_browser.py -v
          python3 -m unittest discover -s tests -p test_browser_content_safety.py -v
